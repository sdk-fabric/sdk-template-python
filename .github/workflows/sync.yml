name: Template-Sync
on:
  workflow_dispatch:
    inputs:
      typehub_user:
        description: 'TypeHub User'
        required: true
      typehub_document:
        description: 'TypeHub Document'
        required: true
permissions:
  contents: write
jobs:
  sync-template:
    runs-on: ubuntu-latest
    steps:
      - uses: sdk-fabric/sync-action@v0.1.1
        with:
          lang: 'python'
